name: Release

# Publishes to npm and creates a GitHub release whenever a v* tag is pushed.
# Authentication is npm trusted publishing (OIDC) — no NPM_TOKEN secret.
# One-time setup on npmjs.com: package Settings → Trusted publisher →
# GitHub Actions, repository sarveshbhatnagar/insights-db, workflow release.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC token for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insights_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/insights_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest && npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"; exit 1
          fi

      # Skipping an already-published version keeps a re-run (or a manually
      # published first release) from failing before the GitHub release step.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "insights-db@${VERSION}" version >/dev/null 2>&1; then
            echo "insights-db@${VERSION} is already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "insights-db ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
